# Latency profile for snd-usb-babyface-pro.
#
# The driver's URB size follows the period the application asks for,
# from frames_per_urb (the largest URB, 256 by default) down to
# urb_frames_min (the smallest, 32 by default). So with the defaults any
# period from 32 frames (0.67 ms at 48 kHz) up is available: the latency
# is the period your sound server or DAW chooses, not a module setting.
#
# Measured on real hardware at 48 kHz, full duplex, mmap, 12 playback
# channels, buffer = 2 periods, real-time priority, 10 minutes per point
# (2026-10-21, see KERNEL-DRIVER.md):
#
#   period   per period   module                        result
#   ------   ----------   ---------------------------   ----------------
#   32       0.67 ms      defaults                      clean (rare system
#                                                       xruns, recovered)
#   24       0.50 ms      urb_frames_min=8 nurbs=16     0 xruns
#   16       0.33 ms      urb_frames_min=8 nurbs=16     1 capture xrun
#   8        0.17 ms      urb_frames_min=8 nurbs=16     loses capture
#                                                       buffers: avoid
#
# The few xruns left at 16-32 frames do not grow as the period shrinks:
# they are system latency events (CPU frequency, interrupts), so at these
# sizes tuning the system matters more than the driver.
#
# Note: PipeWire only uses a small period if the card's node lets it; a
# WirePlumber rule that pins api.alsa.period-size keeps it at that size.

# Low latency: periods down to 16 frames (0.33 ms) become available.
#options snd-usb-babyface-pro urb_frames_min=8 nurbs=16
